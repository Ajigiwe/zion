; Per-directory PHP overrides for this account (LiteSpeed/lsapi loads this in
; place of the system php.ini). Keep runtime limits explicit - anything not
; set here falls back to compiled defaults, not the system file.

expose_php = Off
engine = On

memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 5000

file_uploads = On
upload_max_filesize = 8M
post_max_size = 16M
max_file_uploads = 20

display_errors = Off
log_errors = On
error_log = /home/ziongrou/public_html/storage/logs/php-error.log

date.timezone = Africa/Accra
default_charset = "UTF-8"

session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
