---
# cPanel Git Version Control - deployment hook.
# Layout: the checkout lives in ~/repositories/zion while the site lives in
# ~/public_html, so Deploy copies the code across, then keeps runtime state
# healthy and runs the pre-flight check.
# Every path is absolute (no reliance on cwd or exported variables) and the
# copy uses tar, which every host ships (the earlier rsync step failed here).
deployment:
  tasks:
    - mkdir -p /home/ziongrou/public_html/storage/logs /home/ziongrou/public_html/storage/uploads
    - find /home/ziongrou/public_html -mindepth 1 -maxdepth 1 ! -name storage ! -name cgi-bin ! -name php.ini ! -name .env -exec rm -rf {} +
    - tar -C /home/ziongrou/repositories/zion -cf - --exclude=./.git --exclude=./.env --exclude=./storage/logs --exclude=./storage/uploads --exclude=./deploy.sh --exclude=./.cpanel.yml . | tar -xf - -C /home/ziongrou/public_html
    - cp /home/ziongrou/repositories/zion/storage/uploads/.htaccess /home/ziongrou/public_html/storage/uploads/.htaccess
    - test -f /home/ziongrou/public_html/.env || cp /home/ziongrou/public_html/.env.example /home/ziongrou/public_html/.env
    - php /home/ziongrou/public_html/tools/doctor.php
